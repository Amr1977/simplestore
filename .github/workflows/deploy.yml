name: Deploy to Firebase Hosting
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Build for e2e
        env:
          VITE_USE_FIRESTORE_EMULATOR: 'true'
          VITE_STORE_SLUG: abu-qir-grocery
          VITE_CLOUDINARY_CLOUD_NAME: test-cloud
          VITE_CLOUDINARY_UPLOAD_PRESET: test-preset
          VITE_WHATSAPP_NUMBER: '201234567890'
        run: npm run build
      - name: Run e2e tests
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Inject build-time env vars
        env:
          VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ vars.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_STORE_SLUG: ${{ vars.VITE_STORE_SLUG }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
        run: |
          {
            echo "VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME}"
            echo "VITE_CLOUDINARY_UPLOAD_PRESET=${VITE_CLOUDINARY_UPLOAD_PRESET}"
            echo "VITE_STORE_SLUG=${VITE_STORE_SLUG}"
            echo "VITE_WHATSAPP_NUMBER=${VITE_WHATSAPP_NUMBER}"
          } >> $GITHUB_ENV
      - name: Verify required VITE_ vars are set
        run: |
          missing=""
          for v in VITE_STORE_SLUG VITE_CLOUDINARY_CLOUD_NAME VITE_CLOUDINARY_UPLOAD_PRESET VITE_WHATSAPP_NUMBER; do
            val=$(printenv "$v" || true)
            if [ -z "$val" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repo Variables:$missing. Set them at Settings -> Secrets and variables -> Actions -> Variables, then re-run this workflow. VITE_STORE_SLUG must match the slug field of the store document in Firestore, otherwise the storefront will show 'المتجر غير متاح حالياً' on every page."
            exit 1
          fi
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: simplestore77
